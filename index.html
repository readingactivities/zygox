<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Day to Day Reading Activities</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/6p7vDP0S/WBSEDCL-LOGO.png">
  <style>
    body, html { 
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff;
    }
    
    /* 🚨 মডার্ন রেসপন্সিভ ফ্রেম 🚨 */
    #main-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      /* এটি মোবাইল ব্রাউজারের অটো-স্ক্রলিং হ্যান্ডেল করবে */
      overflow: hidden;
    }
  </style>
</head>
<body>

  <iframe id="main-frame" 
          src="https://script.google.com/macros/s/AKfycbw9V7Z3ROY99x9Akc1ZJt1bL_PwvWb9LLBICzmTEOw0n2NRxojEXWyyvhmtvGSZv-kB/exec" 
          allow="geolocation; microphone; camera">
  </iframe>

  <script>
    // 🚨 স্ক্রিন রিসাইজ হলে ফ্রেম যেন নিজেকে ঠিক করে নেয় 🚨
    window.addEventListener('resize', function() {
        document.getElementById('main-frame').style.height = window.innerHeight + 'px';
    });
  </script>
</body>
</html>
